services:
  keycloak_db:
    image: postgres:14
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: keycloak_user
      POSTGRES_PASSWORD: keycloak_password
    volumes:
      - ./postgres-keycloak-data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
  keycloak:
    image: quay.io/keycloak/keycloak:23.0.6
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/keycloak_db
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: keycloak_password
    command: 
      - start-dev
      - --import-realm
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
      - ./keycloak/keycloak-russian-providers.jar:/opt/keycloak/providers/keycloak-russian-providers.jar
      - ./keycloak/json-path-2.7.0.jar:/opt/keycloak/providers/json-path-2.7.0.jar
      - ./keycloak/json-smart-2.4.7.jar:/opt/keycloak/providers/json-smart-2.4.7.jar
      - ./keycloak/accessors-smart-2.4.7.jar:/opt/keycloak/providers/accessors-smart-2.4.7.jar
    ports:
      - "8080:8080"
    depends_on:
      - keycloak_db
  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
  backend:
    build:
      context: bionicpro-auth
      dockerfile: Dockerfile
    depends_on:
      - keycloak
      - auth_db
    ports:
      - "3001:8081"
    environment:
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_EXTERNAL_URL: http://localhost:8080
      KEYCLOAK_REALM: reports-realm
      CLIENT_ID: bionicpro-auth
      CLIENT_SECRET: sChLTbIfbZFTkEukHJCy9QVAlrMRBWru
      FRONTEND_URL: http://localhost:3000
      CALLBACK_URL: http://localhost:3001/auth/callback
      ENCRYPTION_KEY: MtB1slTolo0W79QvrNNg658z3vV2wfyYDktbKNk0pRI=
      DATABASE_URL: postgresql+asyncpg://auth_user:auth_password@auth_db:5432/bionicpro_auth?ssl=disable
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U auth_user -d bionicpro_auth" ]
      interval: 5s
      timeout: 5s
      retries: 5

  openldap:
    image: osixia/openldap:1.5.0
    container_name: openldap
    command: --copy-service
    volumes:
      - ./ldap/config.ldif:/container/service/slapd/assets/config/bootstrap/ldif/50-bootstrap.ldif
    environment:
      - LDAP_ORGANISATION=BionicPro
      - LDAP_DOMAIN=example.com
      - LDAP_ADMIN_PASSWORD=admin
    ports:
      - "389:389"
  auth_db:
    image: postgres:14
    environment:
      POSTGRES_DB: bionicpro_auth
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_password
    ports:
      - "5435:5432"