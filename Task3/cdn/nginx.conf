proxy_cache_path /var/cache/nginx/reports
    levels=1:2
    keys_zone=reports_cache:10m
    max_size=1g
    inactive=60m
    use_temp_path=off;

server {
    listen 80;
    server_name cdn;

    # ----- Auth subrequest -----
    # Для каждого запроса к файлу nginx сначала делает внутренний запрос
    # к reports-api /auth/verify. Если 200 — отдаёт файл, иначе — 401/403.

    location = /auth/verify {
        internal;  # Доступен только как subrequest, не снаружи

        proxy_pass http://reports-api:8080/auth/verify;

        # Передаём оригинальный URI, чтобы reports-api мог извлечь user_id из пути
        proxy_set_header X-Original-URI $request_uri;

        # Прокидываем Authorization header от исходного запроса
        proxy_set_header Authorization $http_authorization;

        # Не передаём тело запроса — это только проверка доступа
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    # ----- Отдача файлов из MinIO с кешированием -----
    location /reports/ {
        # Проверяем авторизацию перед отдачей файла
        auth_request /auth/verify;

        # Проксируем к MinIO
        proxy_pass http://minio:9000/reports/;

        # --- Настройки кеширования ---
        proxy_cache reports_cache;

        # Ключ кеша — только URI. Каждый отчёт имеет уникальный путь
        # (включает report_name, user_id и даты), поэтому коллизий нет.
        # Авторизация обеспечивается auth_request — он срабатывает ДО отдачи из кеша.
        proxy_cache_key $uri;

        # Кешируем успешные ответы на 30 минут
        proxy_cache_valid 200 30m;

        # Не кешируем ошибки — если файл не найден, при повторном запросе
        # nginx сходит в MinIO заново (файл мог появиться)
        proxy_cache_valid 404 0;
        proxy_cache_valid 500 502 503 504 0;

        # Добавляем заголовок для отладки — HIT/MISS/BYPASS
        add_header X-Cache-Status $upstream_cache_status always;

        # Таймауты проксирования к MinIO
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;

        # Убираем Authorization при запросе к MinIO,
        # т.к. MinIO использует свою авторизацию (или публичный доступ к бакету)
        proxy_set_header Authorization "";

        # Стандартные proxy-заголовки
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Healthcheck
    location /health {
        return 200 '{"status": "ok"}';
        add_header Content-Type application/json;
    }
}