services:
  keycloak_db:
    image: postgres:14
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: keycloak_user
      POSTGRES_PASSWORD: keycloak_password
    volumes:
      - ./postgres-keycloak-data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    networks:
      - auth_net

  keycloak:
    image: quay.io/keycloak/keycloak:23.0.6
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/keycloak_db
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: keycloak_password
    command:
      - start-dev
      - --import-realm
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    ports:
      - "8080:8080"
    depends_on:
      - keycloak_db
    networks:
      - auth_net

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    networks:
      - auth_net

  gateway:
    build:
      context: gateway
      dockerfile: Dockerfile
    depends_on:
      keycloak:
        condition: service_started
      crm_db:
        condition: service_healthy
    ports:
      - "3001:8081"
    environment:
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_EXTERNAL_URL: http://localhost:8080
      KEYCLOAK_REALM: reports-realm
      CLIENT_ID: bionicpro-auth
      CLIENT_SECRET: sChLTbIfbZFTkEukHJCy9QVAlrMRBWru
      FRONTEND_URL: http://localhost:3000
      CALLBACK_URL: http://localhost:3001/auth/callback
      ENCRYPTION_KEY: MtB1slTolo0W79QvrNNg658z3vV2wfyYDktbKNk0pRI=
      DATABASE_URL: postgresql+asyncpg://crm_db_user:crm_db_password@crm_db:5432/bionicpro_crm?ssl=disable
      REPORTS_SERVICE_URL: http://reports-api:8080
    networks:
      - auth_net

  crm_db:
    image: postgres:14
    # Параметры для включения логической репликации:
    # - wal_level=logical: записывать в WAL информацию о логических изменениях
    # - max_replication_slots=1: количество подписчиков, которые могут иметь свои «закладки» в WAL
    # - max_wal_senders=1: количество процессов, которые могут одновременно отправлять WAL подписчикам
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=1
      - -c
      - max_wal_senders=1
    environment:
      POSTGRES_DB: bionicpro_crm
      POSTGRES_USER: crm_db_user
      POSTGRES_PASSWORD: crm_db_password
    volumes:
      - ./postgres-crm-data:/var/lib/postgresql/data
      - ./init-scripts/init-crm-db.sql:/docker-entrypoint-initdb.d/init-crm-db.sql
    ports:
      - "5435:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U crm_db_user -d bionicpro_crm" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - auth_net

  reports-api:
    build:
      context: reports-api
      dockerfile: Dockerfile
    ports:
      - "3003:8080"
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_USER: clickhouse_user
      CLICKHOUSE_PASSWORD: clickhouse_password
      CLICKHOUSE_DATABASE: bionicpro
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: reports-realm
      AUTH_DATABASE_URL: postgresql://crm_db_user:crm_db_password@crm_db:5432/bionicpro_crm
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: reports
      CDN_BASE_URL: http://cdn:80
    depends_on:
      keycloak:
        condition: service_started
      crm_db:
        condition: service_healthy
      minio:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

    networks:
      - auth_net

  clickhouse:
    image: clickhouse/clickhouse-server:23.8
    container_name: clickhouse
    ports:
      - "8123:8123"  # HTTP interface
      - "9009:9000"  # Native client port (сдвинут, т.к. 9000 занят Kafka в docker-сети для внешнего доступа)
    volumes:
      - ./clickhouse/data:/var/lib/clickhouse
      - ./clickhouse/logs:/var/log/clickhouse-server
      - ./clickhouse:/var/lib/clickhouse/user_files
      - ./clickhouse/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    environment:
      CLICKHOUSE_DB: bionicpro
      CLICKHOUSE_USER: clickhouse_user
      CLICKHOUSE_PASSWORD: clickhouse_password
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      CLICKHOUSE_ALWAYS_RUN_INITDB_SCRIPTS: 1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "localhost:8123/ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - auth_net

  kafka:
    image: confluentinc/cp-kafka:7.9.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      # KRaft — режим без Zookeeper
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Listeners:
      # PLAINTEXT — для клиентов внутри docker-сети (Debezium, ClickHouse)
      # CONTROLLER — для внутренней координации KRaft (отдельный порт)
      # PLAINTEXT_HOST — для доступа с хоста (опционально, для отладки)
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # ID кластера (произвольный, но фиксированный)
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      # Настройки топиков (для одного узла: replication-factor = 1)
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      # Автосоздание топиков (Debezium и Kafka Connect создают топики автоматически)
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
    healthcheck:
      test: [ "CMD-SHELL", "kafka-topics --bootstrap-server kafka:29092 --list" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - auth_net

  debezium-connect:
    image: quay.io/debezium/connect:3.0
    container_name: debezium-connect
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: debezium_configs
      OFFSET_STORAGE_TOPIC: debezium_offsets
      STATUS_STORAGE_TOPIC: debezium_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
    depends_on:
      kafka:
        condition: service_healthy
      crm_db:
        condition: service_healthy
    networks:
      - auth_net

  # Одноразовый контейнер: ждёт готовности Kafka Connect и регистрирует
  # Debezium-коннектор для отслеживания таблицы user_profiles в crm_db.
  debezium-init:
    image: curlimages/curl:latest
    depends_on:
      - debezium-connect
    volumes:
      - ./debezium/register-connector.json:/config/register-connector.json
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo 'Waiting for Kafka Connect to be ready...'
        while ! curl -s -o /dev/null -w '%{http_code}' http://debezium-connect:8083/connectors | grep -q 200; do
          echo 'Kafka Connect not ready, retrying in 5s...'
          sleep 5
        done
        echo 'Kafka Connect is ready. Registering connector...'
        curl -s -X POST http://debezium-connect:8083/connectors \
          -H 'Content-Type: application/json' \
          -d @/config/register-connector.json
        echo ''
        echo 'Connector registered successfully.'
    networks:
      - auth_net

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    ports:
      - "9010:9000"   # S3 API
      - "9011:9001"   # Web-консоль MinIO
    healthcheck:
      test: [ "CMD", "mc", "ready", "local" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - auth_net

  # Одноразовый контейнер: создаёт бакет и ставит публичную политику чтения,
  # чтобы nginx мог читать файлы без S3-авторизации.
  # Безопасность обеспечивается auth_request на уровне nginx.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin;
        mc mb --ignore-existing local/reports;
        mc anonymous set download local/reports;
        mc ilm rule add local/reports --expire-days 7;
        echo 'MinIO bucket initialized with 7-day lifecycle policy';        
      "
    networks:
      - auth_net

  cdn:
    build:
      context: cdn
      dockerfile: Dockerfile
    ports:
      - "8888:80"
    depends_on:
      - minio
      - reports-api
    networks:
      - auth_net

volumes:
  minio-data:

networks:
  auth_net:
    driver: bridge